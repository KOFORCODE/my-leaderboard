<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัคร Event — Comboo 500</title>
<style>
  :root { --bg:#0b0d13; --card:#12141c; --line:#2a2e3d; --text:#e9ecf5; --muted:#8a90a6; --accent:#f2b93e; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  .box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 6px; font-size:1.35rem; color:var(--accent); }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; line-height:1.5; }
  label { display:block; font-size:.85rem; margin-bottom:6px; color:var(--muted); }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0b0d13;
          color:var(--text); font-size:1rem; font-family:'JetBrains Mono',monospace; }
  input:focus { outline:none; border-color:var(--accent); }
  button { margin-top:14px; width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
           color:#000; font-weight:700; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:.92rem; line-height:1.5; display:none; }
  .msg.ok { display:block; background:#3ecf8e1a; border:1px solid var(--ok); color:var(--ok); }
  .msg.err { display:block; background:#ff6b6b1a; border:1px solid var(--err); color:var(--err); }
  .status { font-size:.85rem; color:var(--muted); margin-bottom:16px; }
</style>
</head>
<body>
<div class="box">
  <h1>สมัคร Event</h1>
  <p class="sub" id="rule">สำหรับผู้เล่นที่มีอันดับในเว็บไซต์ตั้งแต่ D+ ขึ้นไป กรอก UID ของคุณเพื่อสมัคร</p>
  <div class="status" id="status">กำลังโหลดสถานะ...</div>

  <form id="form" autocomplete="off">
    <label for="uid">UID Free Fire</label>
    <input id="uid" name="uid" inputmode="numeric" placeholder="เช่น 1234567890" maxlength="20" required>
    <button type="submit" id="btn">สมัคร</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script>
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
const statusEl = document.getElementById('status');
const uidInput = document.getElementById('uid');

function show(type, text) {
  msg.className = 'msg ' + type;
  msg.textContent = text;
}

async function loadStatus() {
  try {
    const r = await fetch('/api/event-signup');
    const d = await r.json();
    document.getElementById('rule').textContent = `สำหรับผู้เล่นที่มีอันดับในเว็บไซต์ตั้งแต่ ${d.minTier} ขึ้นไป กรอก UID ของคุณเพื่อสมัคร`;
    if (!d.open) {
      statusEl.textContent = 'ปิดรับสมัครแล้ว';
      btn.disabled = true;
      uidInput.disabled = true;
    } else {
      statusEl.textContent = `สมัครแล้ว ${d.count} คน`;
    }
  } catch {
    statusEl.textContent = 'โหลดสถานะไม่สำเร็จ';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const uid = uidInput.value.trim();
  if (!/^\d{5,20}$/.test(uid)) {
    show('err', 'UID ต้องเป็นตัวเลข 5–20 หลัก');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  msg.className = 'msg';
  try {
    const r = await fetch('/api/event-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      show('ok', `สมัครสำเร็จ ✅ ${d.name} (UID ${d.uid})`);
      uidInput.value = '';
      loadStatus();
    } else {
      show('err', d.error || 'สมัครไม่สำเร็จ ลองใหม่อีกครั้ง');
    }
  } catch {
    show('err', 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง');
  } finally {
    btn.disabled = false;
    btn.textContent = 'สมัคร';
  }
});

loadStatus();
</script>
</body>
</html>
