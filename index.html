<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Comboo 500 Tier List - ลำดับชั้นผู้เล่นชั้นดีเยี่ยม">

  <!-- Open Graph สำหรับ Discord Embed -->
  <meta property="og:title" content="🏆 Comboo 500 Tier List">
  <meta property="og:description" content="อันดับผู้เล่น Comboo 500 - ตรวจสอบการจัดอันดับและ Tier ของคุณ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://comboo.net">
  <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630'%3E%3Crect fill='%231a1a2e' width='1200' height='630'/%3E%3Ctext x='50%25' y='50%25' font-size='80' font-weight='bold' fill='%2300d4ff' text-anchor='middle' dominant-baseline='middle' font-family='Arial'%3EComboo 500%3C/text%3E%3Ctext x='50%25' y='65%25' font-size='40' fill='%23a0a0a0' text-anchor='middle' dominant-baseline='middle' font-family='Arial'%3ETier List Ranking%3C/text%3E%3C/svg%3E">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🏆 Comboo 500 Tier List">
  <meta name="twitter:description" content="ดูอันดับผู้เล่น Comboo 500">

  <title>Comboo 500 — Tier List 🏆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00d4ff;
      --secondary: #ff006e;
      --accent: #ffd60a;
      --bg-dark: #0a0e27;
      --bg-light: #16213e;
      --bg-card: #1a1a2e;
      --border: #2a2a4e;
      --text-primary: #ffffff;
      --text-secondary: #b0b0c0;
      --success: #04d361;
      --warning: #ffb703;
      --danger: #ff006e;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0033 50%, var(--bg-dark) 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== HEADER & NAV ========== */
    header {
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 30px rgba(0, 212, 255, 0.1);
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .logo::before {
      content: "🏆";
      font-size: 1.8rem;
    }

    .nav-center {
      display: flex;
      gap: 1.5rem;
      flex: 1;
      justify-content: center;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: var(--transition);
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }

    .nav-link:hover {
      color: var(--primary);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 250px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* ========== HERO SECTION ========== */
    .hero {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(255, 0, 110, 0.1));
      border-bottom: 1px solid var(--border);
      padding: 2rem 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(120deg, var(--primary), var(--secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    .hero-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 12px;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.15);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* ========== MAIN CONTENT ========== */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding: 0.5rem 0;
      scroll-behavior: smooth;
    }

    .tab-btn {
      padding: 0.7rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      border-color: var(--primary);
      color: #000;
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.25);
    }

    /* ========== TABLE ========== */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .table-header {
      display: grid;
      grid-template-columns: 50px 1fr 100px;
      gap: 1rem;
      padding: 1rem;
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.05), rgba(255, 0, 110, 0.05));
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      position: sticky;
      top: 80px;
      z-index: 10;
    }

    .table-row {
      display: grid;
      grid-template-columns: 50px 1fr 100px;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: var(--transition);
      cursor: pointer;
    }

    .table-row:hover {
      background: rgba(0, 212, 255, 0.08);
      border-left: 3px solid var(--primary);
      padding-left: calc(1rem - 3px);
    }

    .table-row:last-child {
      border-bottom: none;
    }

    .rank-badge {
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .player-avatar {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-details h3 {
      font-size: 1rem;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .player-details p {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .tier-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .tier-s { background: rgba(255, 0, 110, 0.2); color: var(--secondary); border: 1px solid var(--secondary); }
    .tier-a { background: rgba(255, 165, 0, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .tier-b { background: rgba(0, 212, 255, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .tier-c { background: rgba(176, 176, 192, 0.2); color: var(--text-secondary); border: 1px solid var(--text-secondary); }

    /* ========== LOADING STATE ========== */
    .loading {
      text-align: center;
      padding: 3rem 1rem;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ========== MODAL ========== */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-backdrop.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.5rem;
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--primary);
      transform: rotate(90deg);
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header-container {
        flex-wrap: wrap;
      }

      .nav-center {
        order: 3;
        width: 100%;
        gap: 0.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }

      .nav-link {
        flex: 1;
        text-align: center;
        font-size: 0.8rem;
        padding: 0.4rem;
      }

      .search-box {
        max-width: 100%;
      }

      .table-header,
      .table-row {
        grid-template-columns: 35px 1fr 70px;
        padding: 0.75rem;
        gap: 0.75rem;
      }

      .player-avatar {
        width: 40px;
        height: 40px;
      }

      .player-details h3 {
        font-size: 0.9rem;
      }

      .player-details p {
        font-size: 0.75rem;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tier-badge {
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
      }

      .modal-content {
        padding: 1.5rem;
        width: 95%;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 0.75rem;
      }

      .hero-title {
        font-size: 1.5rem;
      }

      .hero {
        padding: 1.5rem 1rem;
        margin-bottom: 1.5rem;
      }

      main {
        padding: 0 0.75rem 2rem;
      }

      .table-header,
      .table-row {
        grid-template-columns: 30px 1fr;
      }

      .table-row {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .rank-badge {
        text-align: left;
      }

      .tier-badge {
        width: 100%;
        text-align: center;
      }

      .logo {
        font-size: 1.2rem;
      }

      .search-box {
        order: 2;
        width: 100%;
        max-width: 100%;
      }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    /* ========== ANIMATIONS ========== */
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .gradient-text {
      background: linear-gradient(120deg, var(--primary), var(--secondary), var(--primary));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease infinite;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div class="logo">Comboo 500</div>
      <nav class="nav-center">
        <a href="/" class="nav-link">🏆 Rankings</a>
        <a href="https://discord.gg/comboo" class="nav-link" target="_blank">💬 Discord</a>
        <a href="https://api.comboo.net/docs" class="nav-link" target="_blank">📄 API</a>
      </nav>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="ค้นหา UID หรือชื่อ...">
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1 class="hero-title">🏆 TIER LIST</h1>
    <p class="hero-subtitle">ลำดับชั้นผู้เล่นชั้นดีเยี่ยม</p>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Players</div>
        <div class="stat-value" id="totalPlayers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tier S</div>
        <div class="stat-value" id="tierSCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Updated</div>
        <div class="stat-value" id="lastUpdate">—</div>
      </div>
    </div>
  </section>

  <!-- MAIN -->
  <main>
    <!-- TABS -->
    <div class="tabs" id="tabsContainer">
      <button class="tab-btn active" data-mode="overall">📊 Overall</button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <div class="table-header">
        <div style="text-align: center;">#</div>
        <div>Player</div>
        <div style="text-align: center;">Tier</div>
      </div>
      <div id="tableBody">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">กำลังโหลดข้อมูล...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    const SUPABASE_URL = 'https://qfdtnfhcdxucckxakrgu.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_XGA4PQ3GY1LpEmSSRTyONg_2ogqR06G';

    // ========== GLOBALS ==========
    let players = [];
    let modes = [];
    let tiers = [];
    let activeMode = 'overall';

    // ========== MAIN LOAD ==========
    async function load() {
      try {
        // ดึงข้อมูลจาก Supabase
        const [playersData, modesData, tiersData] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/players?select=*`, {
            headers: { 'apikey': SUPABASE_ANON }
          }).then(r => r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/modes?select=*`, {
            headers: { 'apikey': SUPABASE_ANON }
          }).then(r => r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/tiers?select=*`, {
            headers: { 'apikey': SUPABASE_ANON }
          }).then(r => r.json())
        ]);

        players = playersData || [];
        modes = modesData || [];
        tiers = tiersData || [];

        updateUI();
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('tableBody').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>Failed to load data</div></div>';
      }
    }

    // ========== UI UPDATE ==========
    function updateUI() {
      // Update stats
      document.getElementById('totalPlayers').textContent = players.length;
      document.getElementById('tierSCount').textContent = tiers.filter(t => t.tier_type === 'S').length;
      document.getElementById('lastUpdate').textContent = 'Now';

      // Render tabs
      const tabsHTML = modes
        .filter(m => m.include_in_overall !== false)
        .map(m => `<button class="tab-btn" data-mode="${m.id}">${m.emoji || '📌'} ${m.name}</button>`)
        .join('');
      document.getElementById('tabsContainer').innerHTML = `<button class="tab-btn active" data-mode="overall">📊 Overall</button>${tabsHTML}`;

      // Attach tab listeners
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.mode));
      });

      renderTable();
    }

    function renderTable() {
      const rankedPlayers = getRankedPlayers();

      if (!rankedPlayers.length) {
        document.getElementById('tableBody').innerHTML = '<div class="empty-state"><div class="empty-state-icon">😴</div><div>No players found</div></div>';
        return;
      }

      const html = rankedPlayers
        .map((p, i) => {
          const tierType = getTierType(p.id);
          const tierClass = `tier-${tierType.toLowerCase()}`;
          return `
            <div class="table-row" onclick="openModal('${p.id}')">
              <div class="rank-badge">#${i + 1}</div>
              <div class="player-info">
                <div class="player-avatar">${p.name.charAt(0).toUpperCase()}</div>
                <div class="player-details">
                  <h3>${escapeHtml(p.name)}</h3>
                  <p>UID: ${p.uid || 'N/A'}</p>
                </div>
              </div>
              <div class="tier-badge ${tierClass}">${tierType || '—'}</div>
            </div>
          `;
        })
        .join('');

      document.getElementById('tableBody').innerHTML = html;
    }

    function getRankedPlayers() {
      if (activeMode === 'overall') {
        return players.sort((a, b) => {
          const scoreA = getPlayerScore(a.id);
          const scoreB = getPlayerScore(b.id);
          return scoreB - scoreA;
        });
      }

      const modeFilter = tiers.filter(t => t.mode_id === activeMode).map(t => t.player_id);
      return players
        .filter(p => modeFilter.includes(p.id))
        .sort((a, b) => {
          const tierA = tiers.find(t => t.player_id === a.id && t.mode_id === activeMode);
          const tierB = tiers.find(t => t.player_id === b.id && t.mode_id === activeMode);
          return getTierScore(tierB?.tier_type || 'C') - getTierScore(tierA?.tier_type || 'C');
        });
    }

    function getPlayerScore(playerId) {
      const scores = { S: 4, A: 3, B: 2, C: 1 };
      return tiers
        .filter(t => t.player_id === playerId)
        .reduce((sum, t) => sum + (scores[t.tier_type] || 0), 0);
    }

    function getTierType(playerId) {
      const tier = tiers.find(t => t.player_id === playerId && t.mode_id === activeMode);
      return tier?.tier_type || '—';
    }

    function getTierScore(type) {
      const scores = { S: 4, A: 3, B: 2, C: 1 };
      return scores[type] || 0;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function switchTab(mode) {
      activeMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      renderTable();
    }

    function openModal(playerId) {
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      const tier = tiers.find(t => t.player_id === playerId && t.mode_id === activeMode);
      const tierClass = `tier-${tier?.tier_type?.toLowerCase() || 'c'}`;

      document.getElementById('modalBody').innerHTML = `
        <div style="text-align: center;">
          <div class="player-avatar" style="width: 80px; height: 80px; font-size: 3rem; margin: 0 auto 1rem;">
            ${player.name.charAt(0).toUpperCase()}
          </div>
          <h2 style="margin-bottom: 0.5rem;">${escapeHtml(player.name)}</h2>
          <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">UID: ${player.uid || 'N/A'}</p>
          <div class="tier-badge ${tierClass}" style="display: inline-block; font-size: 1.2rem; padding: 0.8rem 1.5rem; margin-bottom: 2rem;">
            ${tier?.tier_type || '—'}
          </div>
          <div style="background: var(--bg-light); padding: 1rem; border-radius: 8px; text-align: left; font-size: 0.9rem;">
            <div style="margin-bottom: 0.5rem;"><strong>Region:</strong> ${player.region || 'TH'}</div>
            <div><strong>Badge:</strong> ${player.badge || 'None'}</div>
          </div>
        </div>
      `;

      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    // Search functionality
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const query = e.target.value.trim().toLowerCase();
      const player = players.find(p =>
        p.name.toLowerCase().includes(query) ||
        String(p.uid).includes(query)
      );
      if (player) openModal(player.id);
      else alert('ไม่พบผู้เล่นนี้');
    });

    // Load data
    load();
  </script>
</body>
</html>
