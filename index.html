<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/pX75NqQp/333407178686439927.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
:root{
  --bg0:#08090d;--bg1:#12141c;--bg2:#171a24;--bg3:#1f2330;
  --text1:#f4f5f9;--text2:#8d93a8;--text3:#4d5268;
  --accent:#f2b93e;--accent2:#c98a1f;--accent-soft:#f2b93e18;
  --border:#ffffff0c;--border2:#ffffff18;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 520px at 18% -8%, #f2b93e14, transparent 60%),
    radial-gradient(900px 460px at 100% 0%, #6c63ff10, transparent 55%),
    var(--bg0);
  color:var(--text1);font-family:var(--font-body);min-height:100vh;
  letter-spacing:.01em;
}

/* NAV */
nav{background:#12141ce6;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-text{font-family:var(--font-display);font-size:1.32rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text1)}
.logo-text span{background:linear-gradient(135deg,#ffd875,var(--accent) 55%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #f2b93e33)}
.nav-center{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--text3);font-size:.78rem;font-weight:600;letter-spacing:.03em;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;text-decoration:none}
.nav-link:hover{color:var(--text1);background:#ffffff09}
.nav-right{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative}
.search-wrap .search-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border:none;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:color .15s,background .15s;font-weight:700}
.search-wrap .search-btn:hover{color:var(--accent);background:#f2b93e30}
.search-wrap .search-btn svg{width:18px;height:18px;pointer-events:none}
.search-wrap input{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:8px 34px 8px 12px;color:var(--text1);font-size:.82rem;font-family:var(--font-body);width:216px;outline:none;transition:border .2s,background .2s}
.search-wrap input:focus{border-color:#f2b93e55;background:var(--bg3)}
.search-wrap input::placeholder{color:var(--text3)}
.kbd{background:var(--bg3);border:1px solid var(--border2);color:var(--text3);font-family:var(--font-mono);font-size:.62rem;padding:2px 6px;border-radius:5px;position:absolute;right:9px;top:50%;transform:translateY(-50%)}

/* TABS */
.tabs-bar{background:var(--bg1);border-bottom:1px solid var(--border);padding:.65rem 1.5rem;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{display:flex;align-items:center;gap:7px;padding:0 16px;height:38px;border:1px solid transparent;border-radius:10px;background:none;color:var(--text3);font-family:var(--font-display);font-size:.8rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap;position:relative}
.tab-btn:hover{color:var(--text1);background:#ffffff08;border-color:var(--border2)}
.tab-btn.active{color:#1a1305;background:linear-gradient(135deg,#ffd875,var(--accent) 70%);border-color:transparent;box-shadow:0 4px 16px #f2b93e3d,0 0 0 1px #f2b93e40 inset}
.tab-icon{font-size:1rem;display:flex;align-items:center}
.tab-icon img{width:20px;height:20px;object-fit:contain;border-radius:3px}

/* SERVER BADGE */
.server-info{display:flex;align-items:center;gap:8px;margin-left:auto;padding:0 1rem}
.server-ip-badge{background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:5px 11px;font-family:var(--font-mono);font-size:.7rem;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:6px}
.server-ip-badge span{color:var(--text3)}

/* MAIN */
main{max-width:1280px;margin:0 auto;padding:1.25rem 1.5rem 4rem}

/* TABLE */
.table-wrap{background:linear-gradient(180deg,var(--bg1),var(--bg1) 96%,var(--bg0));border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px -20px #00000080}
.t-head{display:grid;grid-template-columns:64px minmax(0,1fr) 1fr;padding:0 1.1rem;height:40px;align-items:center;border-bottom:1px solid var(--border);color:var(--text3);font-family:var(--font-display);font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500;gap:8px}
.t-head-right{text-align:left;padding-left:0}

.t-row{display:grid;grid-template-columns:64px minmax(0,1fr) 1fr;padding:0 1.1rem;align-items:center;border-bottom:1px solid var(--border);transition:background .15s;min-height:76px;gap:8px}
.t-row:last-child{border-bottom:none}
.t-row:hover{background:#ffffff04}
.t-row.r1{background:linear-gradient(90deg,#f5c84216,#e8b84b06);border-left:3px solid #f5c842;box-shadow:inset 0 0 0 1px #f5c84230,0 0 34px #f5c84212}
.t-row.r1 .player-name{color:#ffdd85}
.t-row.r1 .reg{background:#f5c84222;color:#f5c842;border-color:#f5c84250}
.t-row.r1 .player-badge{background:#f5c84220;color:#f5d060;border-color:#f5c84250}
.t-row.r1 .badge-pts{color:#e0b23c}
.t-row.r1 .mode-icon{border-color:#f5c84266!important;box-shadow:0 0 8px #f5c84244}
.t-row.r1 .tier-mini{background:#f5c84222!important;color:#f5d060!important;border-color:#f5c84266!important;box-shadow:0 0 6px #f5c84244}
.t-row.r1 .avatar{border:2px solid #f5c84255;box-shadow:0 0 12px #f5c84240}
.t-row.r2{background:linear-gradient(90deg,#c8d0de14,#a0a8b806);border-left:3px solid #c8d0de;box-shadow:inset 0 0 0 1px #c8d0de2c,0 0 30px #c8d0de0e}
.t-row.r2 .player-name{color:#e2e7f2}
.t-row.r2 .reg{background:#c8d0de22;color:#d4dbe8;border-color:#c8d0de50}
.t-row.r2 .player-badge{background:#c8d0de20;color:#d4dbe8;border-color:#c8d0de50}
.t-row.r2 .badge-pts{color:#a5aec4}
.t-row.r2 .mode-icon{border-color:#c8d0de66!important;box-shadow:0 0 8px #c8d0de44}
.t-row.r2 .tier-mini{background:#c8d0de22!important;color:#d4dbe8!important;border-color:#c8d0de66!important;box-shadow:0 0 6px #c8d0de44}
.t-row.r2 .avatar{border:2px solid #c8d0de55;box-shadow:0 0 10px #c8d0de33}
.t-row.r3{background:linear-gradient(90deg,#e0906014,#c87a3a06);border-left:3px solid #e09060;box-shadow:inset 0 0 0 1px #e0906030,0 0 30px #e090600e}
.t-row.r3 .player-name{color:#f0ae82}
.t-row.r3 .reg{background:#e0906022;color:#e09060;border-color:#e0906050}
.t-row.r3 .player-badge{background:#e0906020;color:#e8a070;border-color:#e0906050}
.t-row.r3 .badge-pts{color:#c17a48}
.t-row.r3 .mode-icon{border-color:#e0906066!important;box-shadow:0 0 8px #e0906044}
.t-row.r3 .tier-mini{background:#e0906022!important;color:#e8a070!important;border-color:#e0906066!important;box-shadow:0 0 6px #e0906044}
.t-row.r3 .avatar{border:2px solid #e0906055;box-shadow:0 0 10px #e0906033}
.t-row{transition:background .15s,transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;}
.t-row:hover{background:#ffffff06;transform:translateY(-3px) scale(1.008);box-shadow:0 10px 30px #0000006a,0 2px 10px #00000045;border-radius:12px;z-index:3;position:relative;}

/* RANK */
.rank-wrap{display:flex;align-items:center;gap:0;justify-content:flex-start}
.rank-box{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.1rem;font-weight:600;background:var(--bg3)}
.t-row.r1 .rank-box{background:linear-gradient(135deg,#ffe08a,#c8960c);color:#241a02;border:2px solid #f5c842;box-shadow:0 0 12px #f5c84266}
.t-row.r2 .rank-box{background:linear-gradient(135deg,#eef2f9,#8d9bb5);color:#1a1e28;border:2px solid #c8d0de;box-shadow:0 0 12px #c8cfe066}
.t-row.r3 .rank-box{background:linear-gradient(135deg,#f0a878,#a0522d);color:#241203;border:2px solid #e09060;box-shadow:0 0 12px #c87a3a66}
.rank-box.normal{color:var(--text3);font-size:1rem;background:transparent;border:1px solid var(--border2)}

/* PLAYER LEFT */
.player-cell{display:flex;align-items:center;gap:12px;padding:10px 0;min-width:0}
.avatar{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.35rem;font-weight:600;color:var(--text3);overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.avatar-rank-badge{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;border:2px solid var(--bg1)}
.avatar-lockedimg{background:transparent!important;border:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}
.avatar-lockedimg img{width:100%;height:100%;object-fit:contain!important;border-radius:0!important}
.avatar-lowpts img{transform:scale(1.5)}
.avatar-ptsup img{transform:scale(1.3)}
.player-info{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.player-name{font-family:var(--font-body);font-size:.97rem;font-weight:700;color:var(--text1);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word;line-height:1.25}
.player-sub{display:flex;align-items:center;gap:6px}
.player-badge{font-family:var(--font-mono);font-size:.66rem;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-diamond{background:#00d4ff18;color:#55e0ff;border:1px solid #00d4ff30}
.badge-master{background:#aa44ff18;color:#cc77ff;border:1px solid #aa44ff30}
.badge-ace{background:#e8b84b18;color:#e8b84b;border:1px solid #e8b84b30}
.badge-pts{color:var(--text3);font-family:var(--font-mono);font-size:.68rem;font-weight:600}

/* TIERS RIGHT */
.tiers-col{display:flex;align-items:center;justify-content:flex-start;gap:5px;flex-wrap:nowrap;overflow:hidden;}
.mode-tier-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.mode-icon{width:30px;height:30px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:.85rem;overflow:hidden;border:1px solid var(--border2)}
.mode-icon img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.tier-mini{height:18px;min-width:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.62rem;font-weight:700;border:1px solid;padding:0 4px}

/* TIER COLOURS */
.t-S {background:#e8b84b18;color:#e8b84b;border-color:#e8b84b50}
.t-Ap{background:#ff4d4d18;color:#ff6b6b;border-color:#ff4d4d50}
.t-A {background:#ff7a2718;color:#ff9355;border-color:#ff7a2750}
.t-Am{background:#ffaa0018;color:#ffbe44;border-color:#ffaa0050}
.t-Bp{background:#a8ff2718;color:#c3ff5a;border-color:#a8ff2750}
.t-B {background:#44ff8818;color:#5fffaa;border-color:#44ff8850}
.t-Bm{background:#00d4aa18;color:#00e8bb;border-color:#00d4aa50}
.t-Cp{background:#27b8ff18;color:#55cbff;border-color:#27b8ff50}
.t-C {background:#2787ff18;color:#55a3ff;border-color:#2787ff50}
.t-Cm{background:#6c63ff18;color:#9d97ff;border-color:#6c63ff50}
.t-Dp{background:#aa44ff18;color:#cc77ff;border-color:#aa44ff50}
.t-D {background:#ff44bb18;color:#ff77cc;border-color:#ff44bb50}
.t-Dm{background:#ff446618;color:#ff7788;border-color:#ff446650}
.t-F {background:#44444418;color:#777;border-color:#44444450}

/* REGION */
.reg{display:inline-block;padding:3px 8px;border-radius:20px;font-family:var(--font-mono);font-size:.62rem;font-weight:700;letter-spacing:.05em}
.reg-TH{background:#00d4aa18;color:#00d4aa;border:1px solid #00d4aa30}
.reg-AS{background:#6c63ff18;color:#9d97ff;border:1px solid #6c63ff30}
.reg-EU{background:#27b8ff18;color:#55cbff;border:1px solid #27b8ff30}
.reg-NA{background:#ffaa0018;color:#ffbe44;border:1px solid #ffaa0030}

/* EMPTY / LOADING */
.empty{text-align:center;padding:5rem 2rem;color:var(--text3)}
.empty .empty-icon{font-size:2.5rem;margin-bottom:12px}
.empty p{font-size:.9rem;margin-top:6px}
.loading{text-align:center;padding:4rem;color:var(--text3);font-size:.88rem}
.loading-dots::after{content:'...';animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%,100%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

/* HERO STATS */
.hero{display:none;padding:1.1rem 1.5rem .3rem;max-width:1280px;margin:0 auto;align-items:center;gap:12px}
.stat-card{background:linear-gradient(160deg,var(--bg1),var(--bg2));border:1px solid var(--border);border-radius:12px;padding:.85rem 1.3rem;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px -12px #00000060}
.stat-icon{font-size:1.15rem;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-info{}
.stat-label{font-family:var(--font-display);font-size:.64rem;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
.stat-val{font-family:var(--font-display);font-size:1.2rem;font-weight:600;color:var(--text1);line-height:1.15;letter-spacing:.01em}
.stat-val small{font-family:var(--font-body);font-size:.68rem;color:var(--text3);font-weight:500;margin-left:3px}

.mobile-tiers{display:none}
@media(max-width:768px){
  .t-head,.t-row{grid-template-columns:44px minmax(0,1fr) auto;gap:6px}
  .t-row{align-items:center}
  .rank-wrap{display:flex;align-items:center;justify-content:center}
  .rank-box{width:34px;height:34px;font-size:.9rem}
  .player-cell{padding:8px 0;gap:8px}
  .avatar{width:40px;height:40px;font-size:1rem;flex-shrink:0}
  .player-name{font-size:.85rem}
  .tiers-col{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;overflow:visible}
  .mode-tier-item{flex-direction:column;align-items:center;gap:3px}
  .mode-icon{width:28px;height:28px;border-radius:6px;font-size:.8rem}
  .tier-mini{height:19px;min-width:30px;font-size:.62rem;padding:0 4px}
  .t-head-tiers{display:block;text-align:right}
  .tabs-bar{padding:.6rem .9rem;gap:8px}
  .tab-btn{flex-direction:column;justify-content:center;height:auto;min-width:72px;padding:9px 12px 10px;font-size:.66rem;gap:6px;border-radius:12px}
  .tab-icon img{width:26px;height:26px}
  .tab-icon{font-size:1.3rem}
  nav{padding:0 1rem}
  main,.hero{padding-left:1rem;padding-right:1rem}
  .hero{flex-wrap:wrap}
  .nav-center{display:flex;gap:6px}
  .nav-link{display:none}
  #discordLink{display:block;padding:6px 10px;font-size:0.7rem}
  .search-wrap input{width:150px}
  .server-info{display:none!important}
}

/* RIPPLE */
.ripple-host{position:relative;overflow:hidden}
@keyframes ripple-expand{to{transform:scale(4);opacity:0}}
.ripple-circle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#f2b93e4a 0%,#f2b93e00 70%);
  transform:scale(0);animation:ripple-expand .55s ease-out forwards;
  pointer-events:none;
}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:#05060988;backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .2s}
.modal-backdrop.show{opacity:1}
.modal-card{background:#13172200;width:100%;max-width:360px;border-radius:22px;overflow:hidden;transform:translateY(20px) scale(.96);transition:transform .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.modal-backdrop.show .modal-card{transform:translateY(0) scale(1)}
.modal-inner{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--border2);border-radius:22px;padding:2.1rem 1.5rem 1.6rem;text-align:center;position:relative;box-shadow:0 30px 80px -20px #000000a0}
.modal-inner::before{content:'';position:absolute;top:0;left:14%;right:14%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--bg2);color:var(--text1)}
.modal-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2.3rem;font-weight:600;color:var(--text3);margin:0 auto 14px;overflow:hidden;border:3px solid var(--border2);box-shadow:0 0 0 5px #f2b93e10}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar.locked{background:transparent;border:none;border-radius:0;overflow:visible;box-shadow:none}
.modal-avatar.locked img{object-fit:contain;border-radius:0}
.modal-avatar.lowpts img{transform:scale(1.5)}
.modal-avatar.ptsup img{transform:scale(1.3)}
.modal-name{font-family:var(--font-display);font-size:1.4rem;font-weight:600;letter-spacing:.01em;background:linear-gradient(135deg,#ffe9ad,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.modal-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 15px;border-radius:20px;font-family:var(--font-mono);font-size:.78rem;font-weight:700;margin-bottom:9px}
.modal-region{color:var(--text3);font-size:.8rem;margin-bottom:18px;font-weight:500}
.modal-section{text-align:left;margin-top:16px}
.modal-section-title{font-family:var(--font-display);font-size:.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px}
.modal-position-box{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.modal-pos-num{font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--accent);min-width:32px}
.modal-pos-detail{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600}
.modal-tiers-box{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px}

/* BANNER */
.banner{display:none;max-width:1280px;margin:0 auto;padding:1.6rem 1.5rem .4rem;text-align:center}
.banner-title{font-family:var(--font-display);font-size:2rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.banner-title span{background:linear-gradient(120deg,#ffd875,var(--accent) 45%,#ffe9ad 60%,var(--accent2));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShift 6s linear infinite}
@keyframes titleShift{to{background-position:200% center}}
.banner-sub{color:var(--text2);font-size:.86rem;margin-top:6px}
.banner-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:1rem}
.bstat{display:flex;align-items:center;gap:8px;background:linear-gradient(160deg,var(--bg1),var(--bg2));border:1px solid var(--border2);border-radius:999px;padding:7px 16px;font-size:.78rem;color:var(--text2);font-weight:600}
.bstat b{font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--accent);letter-spacing:.02em}

/* PODIUM */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;max-width:760px;margin:0 auto 1.4rem}
.pod{position:relative;background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--border2);border-radius:16px;padding:1.5rem .6rem 1rem;text-align:center;cursor:pointer;min-width:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;animation:podIn .6s cubic-bezier(.22,1,.36,1) backwards}
.pod:hover{transform:translateY(-6px)}
.pod.p1{padding-top:2rem;padding-bottom:1.3rem;background:linear-gradient(180deg,#f5c84220,var(--bg1) 72%);border-color:#f5c84299;box-shadow:inset 0 0 0 1px #f5c84228,0 12px 46px #f5c84242,0 0 90px #f5c8421a;animation-delay:.1s}
.pod.p2{background:linear-gradient(180deg,#c8d0de1a,var(--bg1) 72%);border-color:#c8d0de77;box-shadow:inset 0 0 0 1px #c8d0de20,0 12px 38px #c8d0de2e,0 0 70px #c8d0de12;animation-delay:.2s}
.pod.p3{background:linear-gradient(180deg,#e090601a,var(--bg1) 72%);border-color:#e0906077;box-shadow:inset 0 0 0 1px #e0906022,0 12px 38px #e0906030,0 0 70px #e0906014;animation-delay:.3s}
.pod.p1:hover{box-shadow:inset 0 0 0 1px #f5c84240,0 16px 56px #f5c84260,0 0 100px #f5c84226}
.pod.p2:hover{box-shadow:inset 0 0 0 1px #c8d0de30,0 16px 48px #c8d0de48,0 0 80px #c8d0de1a}
.pod.p3:hover{box-shadow:inset 0 0 0 1px #e0906038,0 16px 48px #e0906048,0 0 80px #e090601c}
.pod.p1 .pod-av:not(.locked){border:2px solid #f5c84266;box-shadow:0 0 20px #f5c84255}
.pod.p2 .pod-av:not(.locked){border:2px solid #c8d0de66;box-shadow:0 0 18px #c8d0de44}
.pod.p3 .pod-av:not(.locked){border:2px solid #e0906066;box-shadow:0 0 18px #e0906044}
.pod.p1 .pod-av.locked img{filter:drop-shadow(0 0 12px #f5c84299)}
.pod.p2 .pod-av.locked img{filter:drop-shadow(0 0 12px #c8d0de88)}
.pod.p3 .pod-av.locked img{filter:drop-shadow(0 0 12px #e0906088)}
.pod.p1 .pod-pts{color:#e0b23c}
.pod.p2 .pod-pts{color:#a5aec4}
.pod.p3 .pod-pts{color:#c17a48}
@keyframes podIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
.pod-rank{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:.9rem;font-weight:600}
.pod.p1 .pod-rank{background:linear-gradient(135deg,#ffe08a,#c8960c);color:#241a02}
.pod.p2 .pod-rank{background:linear-gradient(135deg,#eef2f9,#8d9bb5);color:#1a1e28}
.pod.p3 .pod-rank{background:linear-gradient(135deg,#f0a878,#a0522d);color:#241203}
.pod-crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:1.6rem;filter:drop-shadow(0 0 10px #f5c84299);animation:crownFloat 2.6s ease-in-out infinite}
@keyframes crownFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.pod-av{width:76px;height:76px;margin:0 auto 10px;border-radius:14px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.9rem;font-weight:600;color:var(--text3)}
.pod.p1 .pod-av{width:96px;height:96px}
.pod-av img{width:100%;height:100%;object-fit:cover}
.pod-av.locked{background:transparent;border-radius:0;overflow:visible}
.pod-av.locked img{object-fit:contain}
.pod-name{font-size:.92rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word}
.pod.p1 .pod-name{color:#ffdd85}
.pod.p2 .pod-name{color:#e2e7f2}
.pod.p3 .pod-name{color:#f0ae82}
.pod-pts{font-family:var(--font-mono);font-size:.72rem;color:var(--text3);font-weight:600;margin-top:5px}
.pod-badge{display:inline-block;margin-top:6px;font-family:var(--font-mono);font-size:.62rem;padding:2px 8px;border-radius:20px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ROW ENTRANCE + #1 SHINE */
.t-row{animation:rowIn .45s ease backwards;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(14px)}}
.t-row.r1{position:relative;overflow:hidden}
.t-row.r1::before{content:'';position:absolute;top:0;bottom:0;left:-40%;width:28%;background:linear-gradient(100deg,transparent,#ffe08a26,transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-40%}100%{left:130%}}

/* BACK TO TOP */
.to-top{position:fixed;right:20px;bottom:24px;width:42px;height:42px;border-radius:50%;border:1px solid #f2b93e55;background:#12141cdd;backdrop-filter:blur(8px);color:var(--accent);font-size:1.1rem;font-weight:700;cursor:pointer;z-index:60;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s}
.to-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.to-top:hover{background:var(--accent-soft)}

@media(max-width:768px){

  .t-row,.pod,.pod-crown,.banner-title span,.t-row.r1::before{animation:none!important}

/* POLISH — เบาๆ ไม่รก */
html{scrollbar-width:thin;scrollbar-color:#f2b93e40 var(--bg0)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg0)}
::-webkit-scrollbar-thumb{background:#f2b93e33;border-radius:10px;border:2px solid var(--bg0)}
::-webkit-scrollbar-thumb:hover{background:#f2b93e66}
::selection{background:#f2b93e55;color:#fff}

/* แสงพื้นหลังเคลื่อนช้าๆ */
body::before{content:'';position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(520px 380px at 15% 25%, #f2b93e12, transparent 70%),
    radial-gradient(560px 420px at 85% 70%, #6c63ff10, transparent 70%),
    radial-gradient(420px 320px at 60% 10%, #00d4aa0a, transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate;will-change:transform}
@keyframes aurora{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}

/* เส้นแสดงความคืบหน้าการเลื่อน */
.scroll-progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;pointer-events:none;
  background:linear-gradient(90deg,var(--accent2),#ffd875,var(--accent));transform-origin:left;transform:scaleX(0);box-shadow:0 0 10px #f2b93e88}

/* hover ของ tier chip */
.tier-mini,.mode-icon{transition:transform .18s ease,box-shadow .18s ease}
.mode-tier-item:hover .tier-mini{transform:translateY(-1px);box-shadow:0 0 10px currentColor}
.mode-tier-item:hover .mode-icon{transform:scale(1.08)}

.search-wrap input:focus{box-shadow:0 0 0 3px #f2b93e1a}

/* FOOTER */
.site-foot{max-width:1280px;margin:0 auto;padding:1.2rem 1.5rem 2.6rem;text-align:center;color:var(--text3);font-size:.74rem;letter-spacing:.04em}
.site-foot::before{content:'';display:block;height:1px;max-width:220px;margin:0 auto 1.1rem;background:linear-gradient(90deg,transparent,#f2b93e55,transparent)}
.site-foot b{font-family:var(--font-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.site-foot b span{color:var(--accent)}
.site-foot .dot{margin:0 8px;opacity:.5}

@media(prefers-reduced-motion:reduce){
  body::before{animation:none!important}
  .mode-tier-item:hover .tier-mini,.mode-tier-item:hover .mode-icon{transform:none}
}

/* TABLE → การ์ดต่อแถว ให้เข้ากับแท่น Top 3 */
.table-wrap{background:none;border:none;box-shadow:none;border-radius:0;overflow:visible}
.t-head{border-bottom:none;height:32px;padding:0 1.4rem}
#tableBody{display:flex;flex-direction:column;gap:8px}
.t-row{position:relative;padding:0 1.4rem;border:1px solid var(--border2);border-radius:14px;
  background:linear-gradient(180deg,#ffffff08,#ffffff02 70%,transparent),var(--bg1);
  box-shadow:0 6px 20px -12px #000000a0}
.t-row:last-child{border-bottom:1px solid var(--border2)}
.t-row::after{content:'';position:absolute;left:0;top:16%;bottom:16%;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#ffd875,var(--accent2));box-shadow:0 0 10px #f2b93e88;opacity:0;transition:opacity .2s;pointer-events:none}
.t-row:hover{border-radius:14px;border-color:#f2b93e44;
  background:linear-gradient(180deg,#f2b93e12,#ffffff03 70%,transparent),var(--bg1);
  box-shadow:0 14px 34px -14px #000000c8,0 0 32px #f2b93e14}
.t-row:hover::after{opacity:1}
.rank-box.normal{background:linear-gradient(180deg,#f2b93e14,transparent);border:1px solid #f2b93e33;color:var(--accent);font-weight:600}
@media(max-width:768px){
  .t-head,.t-row{padding:0 .8rem}
  .t-row{border-radius:12px}
  #tableBody{gap:6px}
}

/* PLAYER CARD (MODAL) */

.modal-card::-webkit-scrollbar{display:none}
.modal-inner{

.mc-rank-chip{position:absolute;bottom:2px;right:-10px;background:var(--rc,var(--accent));color:#16120a;font-family:var(--font-display);font-size:.85rem;font-weight:700;letter-spacing:.02em;padding:2px 10px;border-radius:999px;border:2px solid var(--bg1);box-shadow:0 4px 12px -2px #000000a0}

.mc-stat{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 6px 10px;text-align:center;min-width:0}
.mc-stat-label{font-family:var(--font-display);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-stat-val{font-family:var(--font-display);font-size:1.4rem;font-weight:600;color:var(--text1);line-height:1.15;display:flex;align-items:center;justify-content:center;min-height:32px}
.mc-stat.hl .mc-stat-val{color:var(--rc,var(--accent))}

.mc-tier{display:flex;align-items:center;gap:11px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:9px 12px}

.mc-tier-main{flex:1;min-width:0;text-align:left}
.mc-tier-name{font-size:.8rem;font-weight:600;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-bar{height:4px;background:#ffffff0e;border-radius:4px;margin-top:7px;overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:barIn .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:.3s}
.mc-tier .tier-mini{height:24px;min-width:42px;font-size:.78rem;flex-shrink:0}
.mc-empty{color:var(--text3);text-align:center;padding:1rem;font-size:.85rem;background:var(--bg3);border:1px solid var(--border);border-radius:12px}
@keyframes mcIn{from{opacity:0;transform:translateY(12px)}}
@keyframes barIn{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.mc-hero,.mc-stats,.mc-tiers,.mc-bar i{animation:none!important}}
</style>

<script>
const SUPABASE_URL = 'https://qfdtnfhcdxucckxakrgu.supabase.co';
const SUPABASE_ANON = 'sb_publishable_XGA4PQ3GY1LpEmSSRTyONg_2ogqR06G';

const MAX_ROWS = 100; // ตารางแสดงสูงสุด 100 อันดับ
const TIER_ORDER = ['S','A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-','F'];
const TIER_CLASS = {'S':'t-S','A+':'t-Ap','A':'t-A','A-':'t-Am','B+':'t-Bp','B':'t-B','B-':'t-Bm','C+':'t-Cp','C':'t-C','C-':'t-Cm','D+':'t-Dp','D':'t-D','D-':'t-Dm','F':'t-F'};
const TIER_SCORE = {'S':100,'A+':85,'A':75,'A-':65,'B+':54,'B':46,'B-':38,'C+':30,'C':25,'C-':20,'D+':16,'D':13,'D-':10,'F':0};

let modes=[], players=[], tiers=[], activeMode='overall';
const UNRANKED_IMG='https://i.postimg.cc/RFnks3wd/845844097-28722740970726029-7656611028250855247-n-removebg-preview-(2)-(1).png';
const LOW_POINTS_IMG='https://i.postimg.cc/9fsS7Ws7/845844097-28722740970726029-7656611028250855247-n-removebg-preview-(2)-(2).png';
const MID_POINTS_IMG='https://i.postimg.cc/cCB52fCR/845844097-28722740970726029-7656611028250855247-n-removebg-preview-(2)-(3).png';
const HIGH_POINTS_IMG='https://i.postimg.cc/NMhJ0drN/845844097-28722740970726029-7656611028250855247-n-removebg-preview-(2)-(4).png';
const TOP_POINTS_IMG='https://i.postimg.cc/hPC2mDdd/845844097-28722740970726029-7656611028250855247-n-removebg-preview-(2)-(6).png';

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function jsArg(v){
  return esc(JSON.stringify(v));
}

async function api(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}});
  if(!r.ok) throw new Error(`API error ${r.status}`);
  return r.json();
}

function apiWithTimeout(path, ms=8000){
  return Promise.race([
    api(path),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))
  ]);
}

async function apiRpc(fn, ms=8000){
  const call = fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_ANON,
      'Authorization':'Bearer '+SUPABASE_ANON,
      'Content-Type':'application/json'
    },
    body: JSON.stringify({})
  }).then(r=>{ if(!r.ok) throw new Error(`RPC error ${r.status}`); return r.json(); });
  return Promise.race([
    call,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))
  ]);
}

async function load(){
  // แสดง tab Overall ทันทีก่อน API ตอบ ให้กดได้เลย
  document.getElementById('tabsBar').innerHTML=`<button class="tab-btn active" onclick="setMode('overall')"><span class="tab-icon">🏆</span>Overall</button>`;
  document.getElementById('serverInfo').style.display='flex';

  try{
    // ลองยิง request เดียว (RPC รวม modes+players+player_tiers) ก่อน ลด round-trip จาก 3 เหลือ 1
    try{
      const data = await apiRpc('get_leaderboard_data');
      modes = data.modes || [];
      players = data.players || [];
      tiers = data.player_tiers || [];
    }catch(rpcErr){
      // ยังไม่ได้สร้าง function get_leaderboard_data ใน Supabase หรือ RPC ล้มเหลว
      // → fallback ไปยิง 3 request แบบเดิม กันเว็บพัง
      console.warn('[load] RPC ล้มเหลว, fallback เป็น 3 requests:', rpcErr.message);
      const [modesData,playersData,tiersData]=await Promise.all([
        apiWithTimeout('modes?order=sort_order'),
        apiWithTimeout('players?order=name'),
        apiWithTimeout('player_tiers?select=*')
      ]);
      modes=modesData;
      players=playersData;
      tiers=tiersData;
    }

    // กันข้อมูลที่ tier_type ไม่ใช่ค่าที่กำหนด (เช่น ถูกใส่ข้อความแปลกๆ เข้าฐานข้อมูล) ไม่ให้เข้าหน้าเว็บ
    tiers = (tiers||[]).filter(t=>TIER_ORDER.includes(t.tier_type));
    // รับเฉพาะลิงก์ http/https ที่ตั้งจากหน้า admin (กัน javascript: เข้ามาทางลิงก์บนแถบเมนู)
    const okUrl = u => /^https?:\/\//i.test(String(u||'').trim());

    // โหลด settings เสมอ (ทั้งเคส RPC สำเร็จและล้มเหลว)
    const settingsData = await api('site_settings?id=eq.1').catch(()=>[]);
    const settings = settingsData?.[0];
    if(okUrl(settings?.discord_url)){
      const discordLink = document.getElementById('discordLink');
      if(discordLink) discordLink.href = settings.discord_url;
    }
    if(okUrl(settings?.rankings_url)){
      const rankingsLink = document.getElementById('rankingsLink');
      if(rankingsLink) rankingsLink.href = settings.rankings_url;
    }
    if(okUrl(settings?.api_docs_url)){
      const apiDocsLink = document.getElementById('apiDocsLink');
      if(apiDocsLink) apiDocsLink.href = settings.api_docs_url;
    }

    renderTabs();
    render();
  }catch(err){
    console.error(err);
    document.getElementById('heroStats').innerHTML='';
    const msg=err.message==='timeout'?'การเชื่อมต่อช้าเกินไป ลองรีเฟรชใหม่':'โหลดข้อมูลไม่สำเร็จ';
    document.getElementById('tableBody').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><p>${msg}</p><p style="margin-top:12px"><button onclick="location.reload()" style="background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 20px;font-weight:700;cursor:pointer;font-size:0.85rem">ลองใหม่</button></p></div>`;
  }
}

function setMode(id){activeMode=id;renderTabs();render()}
function tierScore(t){const i=TIER_ORDER.indexOf(t);return i===-1?99:i}

function badgeClass(badge){
  if(!badge)return'badge-ace';
  const b=badge.toLowerCase();
  if(b.includes('master'))return'badge-master';
  if(b.includes('diamond'))return'badge-diamond';
  return'badge-ace';
}

// รูปตามช่วงคะแนน (Low ขึ้นไป) ขยาย 1.3x — Unranked ไม่ขยาย
const POINTS_IMGS=[LOW_POINTS_IMG,MID_POINTS_IMG,HIGH_POINTS_IMG,TOP_POINTS_IMG];

// รูปแทน avatar: Unranked ก่อนเสมอ, แท็บ Overall: ต่ำกว่า 20 ใช้รูปคะแนนต่ำ, 20-50 ใช้รูปคะแนนกลาง
function getAvatarImg(isUnranked, isOverall, pts){
  if(isUnranked) return UNRANKED_IMG;
  if(isOverall && pts<20) return LOW_POINTS_IMG;
  if(isOverall && pts>=20 && pts<=50) return MID_POINTS_IMG;
  if(isOverall && pts>=51 && pts<=100) return HIGH_POINTS_IMG;
  if(isOverall && pts>=101) return TOP_POINTS_IMG;
  return '';
}
function renderRow(p, rank, scoreOrTier, isOverall, allModes, tiersByPlayer){
  const isUnranked = rank===null || rank===undefined;
  const rankClass=(!isUnranked && rank<=3)?` r${rank}`:'';
  const rankBoxClass=(isUnranked || rank>3)?' normal':'';
  const playerName=esc(p.name);
  const reg=esc(p.region||'TH');
  const regClass=String(p.region||'TH').replace(/[^a-zA-Z0-9_-]/g,'');
  const badge=esc(p.badge);
  const rankImg=getAvatarImg(isUnranked, isOverall, scoreOrTier);
  const av=rankImg
    ?`<div class="avatar avatar-lockedimg${rankImg===LOW_POINTS_IMG?' avatar-lowpts':(POINTS_IMGS.includes(rankImg)?' avatar-ptsup':'')}"><img src="${rankImg}" alt="${isUnranked?'Unranked':playerName}" loading="lazy"></div>`
    :(p.avatar
      ?`<div class="avatar"><img src="${esc(p.avatar)}" alt="${playerName}" loading="lazy"></div>`
      :`<div class="avatar">${esc((p.name?.[0]||'?').toUpperCase())}</div>`);

  const bclass=badgeClass(p.badge);
  const scoreText=isUnranked?'Unranked':(isOverall?`${scoreOrTier} pts`:scoreOrTier);
  const ptsHtml=isUnranked?'':(isOverall?` <span class="badge-pts">(${scoreText})</span>`:` <span class="tier-mini ${TIER_CLASS[scoreOrTier]||'t-F'}">${scoreOrTier}</span>`);
  const badgeHtml=isUnranked
    ?`<span class="badge-pts" style="opacity:.7">Unranked</span>`
    :(p.badge
      ?`<span class="player-badge ${bclass}">◈ ${badge}${ptsHtml}</span>`
      :`<span class="${isOverall?'badge-pts':`tier-mini ${TIER_CLASS[scoreOrTier]||'t-F'}`}">${scoreText}</span>`);

  // tiers column — เฉพาะ mode ที่มี tier เท่านั้น
  const modesForRight = allModes.length ? allModes : [];
  const tiersRight = modesForRight.map(m=>{
    const tier=(tiersByPlayer[p.id]||{})[m.id];
    if(!tier) return''; // ไม่มี tier ไม่แสดง
    const iconContent=m.icon_url?`<img src="${esc(m.icon_url)}" alt="${esc(m.name)}">`:esc(m.icon||'🎮');
    return`<div class="mode-tier-item">
      <div class="mode-icon">${iconContent}</div>
      <div class="tier-mini ${TIER_CLASS[tier]||'t-F'}">${tier}</div>
    </div>`;
  }).join('');

  return`<div class="t-row${rankClass}${isUnranked?' unranked':''}" onclick="openModal(${jsArg(p.id)},${isUnranked?'null':rank},${isOverall?scoreOrTier:0})" style="cursor:pointer${isUnranked?';opacity:.65':''}">
    <div class="rank-wrap"><div class="rank-box${rankBoxClass}">${isUnranked?'UR':rank}</div></div>
    <div class="player-cell">
      ${av}
      <div class="player-info">
        <div class="player-name">${playerName} <span class="reg reg-${regClass}">${reg}</span></div>
        <div class="player-sub">${badgeHtml}</div>
      </div>
    </div>
    <div class="tiers-col col-tiers">${tiersRight}</div>
  </div>`;
}

// นับเลขขึ้นตอนโหลดครั้งแรก (ครั้งถัดไปแสดงค่าตรงๆ)
let bannerAnimated=false;
function countUp(el,to){
  if(!el) return;
  if(bannerAnimated||window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=to; return; }
  const t0=performance.now(), dur=900;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(to*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

function updateBanner(){
  const b=document.getElementById('banner');
  if(!b) return;
  b.style.display='block';
  countUp(document.getElementById('bsPlayers'),players.length);
  countUp(document.getElementById('bsModes'),modes.length);
  countUp(document.getElementById('bsTiers'),tiers.length);
  bannerAnimated=true;
}

// แท่นโชว์ Top 3 (เฉพาะแท็บ Overall และมีผู้เล่นอย่างน้อย 3 คน)
function renderPodium(list, scoreMap){
  const el=document.getElementById('podium');
  if(!el) return;
  if(!list || list.length<3){ el.innerHTML=''; return; }
  el.innerHTML='<div class="podium">'+[1,0,2].map(i=>{
    const p=list[i], rank=i+1, pts=scoreMap[p.id];
    const name=esc(p.name);
    const img=getAvatarImg(false,true,pts);
    const scaleCls=img===LOW_POINTS_IMG?' avatar-lowpts':(POINTS_IMGS.includes(img)?' avatar-ptsup':'');
    const av=img
      ?`<div class="pod-av locked${scaleCls}"><img src="${img}" alt="${name}"></div>`
      :(p.avatar
        ?`<div class="pod-av"><img src="${esc(p.avatar)}" alt="${name}"></div>`
        :`<div class="pod-av">${esc((p.name?.[0]||'?').toUpperCase())}</div>`);
    const badgeHtml=p.badge?`<div><span class="pod-badge ${badgeClass(p.badge)}">◈ ${esc(p.badge)}</span></div>`:'';
    return`<div class="pod p${rank}" onclick="openModal(${jsArg(p.id)},${rank},${pts})">
      ${rank===1?'<div class="pod-crown">👑</div>':''}
      <div class="pod-rank">${rank}</div>
      ${av}
      <div class="pod-name">${name}</div>
      <div class="pod-pts">${pts} pts</div>
      ${badgeHtml}
    </div>`;
  }).join('')+'</div>';
}

function render(){
  updateBanner();
  // build per-player tier map: {player_id: {mode_id: tier_type}}
  const tiersByPlayer={};
  tiers.forEach(t=>{
    if(!tiersByPlayer[t.player_id]) tiersByPlayer[t.player_id]={};
    tiersByPlayer[t.player_id][t.mode_id]=t.tier_type;
  });

  if(activeMode==='overall'){
    const overallModes=modes.filter(m=>m.include_in_overall);
    const overallModeIds=new Set(overallModes.map(m=>m.id));
    const scoreMap={};
    const firstTierId={}; // id แถว tier แรกของผู้เล่นใน Overall ใช้ตัดสินเมื่อคะแนนเท่ากัน
    tiers.filter(t=>overallModeIds.has(t.mode_id)).forEach(t=>{
      if(!scoreMap[t.player_id]) scoreMap[t.player_id]=0;
      scoreMap[t.player_id]+=(TIER_SCORE[t.tier_type]||0);
      if(firstTierId[t.player_id]===undefined||t.id<firstTierId[t.player_id]) firstTierId[t.player_id]=t.id;
    });

    const list=players.filter(p=>scoreMap[p.id]!==undefined);
    list.sort((a,b)=>{
      const diff=scoreMap[b.id]-scoreMap[a.id];
      if(diff!==0) return diff;
      // คะแนนเท่ากัน: ใครได้ tier แถวแรกก่อน (id น้อยกว่า) อยู่บนกว่า คนที่เพิ่มทีหลังจึงเป็นรอง
      return (firstTierId[a.id]??0)-(firstTierId[b.id]??0);
    });
    // ตัดให้เหลือแค่ MAX_ROWS อันดับแรก อันดับที่ 101 ขึ้นไปไม่แสดงในตารางและแท่น (ตัวเลขผู้เล่นใช้จำนวนจริง)
    list.splice(MAX_ROWS);

    document.getElementById('heroStats').innerHTML=`
      <div class="stat-card"><span class="stat-icon">👥</span><div class="stat-info"><div class="stat-label">ผู้เล่นทั้งหมด</div><div class="stat-val">${players.length}<small>คน</small></div></div></div>
      <div class="stat-card"><span class="stat-icon">🎮</span><div class="stat-info"><div class="stat-label">Mode ที่นับ</div><div class="stat-val">${overallModes.length}<small>mode</small></div></div></div>
      <div class="stat-card"><span class="stat-icon">⭐</span><div class="stat-info"><div class="stat-label">คะแนนสูงสุด</div><div class="stat-val">${list.length?scoreMap[list[0].id]:0}<small>pts</small></div></div></div>
    `;

    document.getElementById('tierHeader').textContent='TIERS';
    renderPodium(list,scoreMap);
    if(!list.length){
      document.getElementById('tableBody').innerHTML=`<div class="empty"><div class="empty-icon">🏆</div><p>ยังไม่มีข้อมูล Overall</p></div>`;
      return;
    }
    // อันดับ 1-3 แสดงบนแท่นด้านบนแล้ว ตารางเริ่มที่อันดับ 4 (ถ้ามีผู้เล่นน้อยกว่า 3 คน ไม่มีแท่น ตารางแสดงครบ)
    const hasPodium=list.length>=3;
    // list ถูกตัดที่ MAX_ROWS แล้ว ตารางจึงมีไม่เกิน MAX_ROWS แถว (รวมแท่น 1-3)
    const rowList=hasPodium?list.slice(3):list;
    const rankOffset=hasPodium?4:1;
    document.getElementById('tableBody').innerHTML=rowList.length
      ?rowList.map((p,i)=>renderRow(p, i+rankOffset, scoreMap[p.id], true, overallModes, tiersByPlayer)).join('')
      :`<div class="empty" style="padding:2.5rem 2rem"><p>ยังไม่มีผู้เล่นอันดับ 4 ขึ้นไป</p></div>`;
    return;
  }

  // single mode
  const modeTiers=tiers.filter(t=>t.mode_id===activeMode);
  const tierMap={};
  modeTiers.forEach(t=>tierMap[t.player_id]=t);

  let list=players.filter(p=>tierMap[p.id]);
  list.sort((a,b)=>{
    const diff=tierScore(tierMap[a.id]?.tier_type)-tierScore(tierMap[b.id]?.tier_type);
    if(diff!==0) return diff;
    // tier เท่ากัน: ใครได้ rank นี้ก่อน (id แถว player_tiers น้อยกว่า) อยู่บนกว่าเสมอ
    return (tierMap[a.id]?.id??0)-(tierMap[b.id]?.id??0);
  });
  // ตัดให้เหลือแค่ MAX_ROWS อันดับแรก (ตัวเลขผู้เล่นใช้จำนวนจริงก่อนตัด)
  const total=list.length;
  list.splice(MAX_ROWS);

  const counts={};
  TIER_ORDER.forEach(t=>counts[t]=0);
  modeTiers.forEach(t=>{if(counts[t.tier_type]!==undefined)counts[t.tier_type]++});
  const topTier=TIER_ORDER.find(t=>counts[t]>0)||'-';

  document.getElementById('heroStats').innerHTML=`
    <div class="stat-card"><span class="stat-icon">👥</span><div class="stat-info"><div class="stat-label">ผู้เล่น</div><div class="stat-val">${total}<small>คน</small></div></div></div>
    <div class="stat-card"><span class="stat-icon">🥇</span><div class="stat-info"><div class="stat-label">Tier สูงสุด</div><div class="stat-val">${topTier}</div></div></div>
    <div class="stat-card"><span class="stat-icon">⭐</span><div class="stat-info"><div class="stat-label">S Tier</div><div class="stat-val">${counts['S']}<small>คน</small></div></div></div>
  `;

  // For single mode: show only the selected mode. Overall still shows all counted modes.
  const selectedModes=modes.filter(m=>m.id===activeMode);
  document.getElementById('tierHeader').textContent='TIER';
  renderPodium([],{});

  if(!list.length){
    document.getElementById('tableBody').innerHTML=`<div class="empty"><div class="empty-icon">🏆</div><p>ยังไม่มีผู้เล่นใน mode นี้</p></div>`;
    return;
  }
  document.getElementById('tableBody').innerHTML=list.map((p,i)=>
    renderRow(p, i+1, tierMap[p.id]?.tier_type||'F', false, selectedModes, tiersByPlayer)
  ).join('');
}

async function searchPlayer(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q){ showSearchToast('กรุณาพิมพ์ชื่อหรือ UID ก่อนค้นหา'); return; }
  const qLower=q.toLowerCase();

  // ค้นหาแบบตรงตัว UID ก่อน (แม่นยำสุด) ถ้าไม่เจอค่อยหาแบบชื่อ (บางส่วนก็ได้)
  let p = players.find(x=>x.uid && String(x.uid)===q);
  if(!p) p = players.find(x=>String(x.name||'').toLowerCase()===qLower);
  if(!p) p = players.find(x=>String(x.name||'').toLowerCase().includes(qLower)||(x.uid&&String(x.uid).includes(q)));

  if(p){
    openModal(p.id, ...computeRankAndPts(p));
    return;
  }

  // ไม่เจอในฐานข้อมูล — ถ้าพิมพ์มาเป็นตัวเลขล้วน (รูปแบบ UID) ลองไปถาม Free Fire API
  // สร้างเป็น "การ์ดชั่วคราว" ให้ดู ไม่บันทึกอะไรลงฐานข้อมูล
  if(!/^\d{5,15}$/.test(q)){
    showSearchToast('ไม่พบผู้เล่นนี้ในระบบ');
    return;
  }

  showSearchToast('กำลังค้นหาจาก Free Fire...');
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 15000);
    const r=await fetch(`/api/freefire-public?uid=${encodeURIComponent(q)}&region=th`, { signal: ctrl.signal });
    clearTimeout(timer);

    if(r.status===429){ const e=await r.json().catch(()=>({})); showSearchToast(e.error||'ค้นหาถี่เกินไป รอสักครู่แล้วลองใหม่'); return; }
    if(!r.ok){ showSearchToast('ไม่พบผู้เล่นนี้ในระบบ'); return; }

    const data=await r.json();
    if(!data.nickname){ showSearchToast('ไม่พบผู้เล่นนี้ในระบบ'); return; }

    // การ์ดชั่วคราว: มีแค่ชื่อ + UID เท่านั้น ไม่มีแรงค์/badge/tier ใดๆ ไม่ถูกบันทึกลง players[]
    const tempPlayer={ id:`temp-${q}`, name:data.nickname, uid:q, region:'TH', avatar:null, badge:null };
    openModal(null, null, 0, tempPlayer);
  }catch(e){
    const msg=e.name==='AbortError'?'Free Fire API ตอบช้าเกินไป':'ค้นหาไม่สำเร็จ';
    showSearchToast(msg);
  }
}

// คำนวณ rank + คะแนน/tier ของผู้เล่นตาม tab ที่เปิดอยู่ตอนนี้ (overall หรือ mode เดียว)
function computeRankAndPts(p){
  if(activeMode==='overall'){
    const overallModes=modes.filter(m=>m.include_in_overall);
    const overallModeIds=new Set(overallModes.map(m=>m.id));
    const scoreMap={};
    const firstTierId={};
    tiers.filter(t=>overallModeIds.has(t.mode_id)).forEach(t=>{
      if(!scoreMap[t.player_id]) scoreMap[t.player_id]=0;
      scoreMap[t.player_id]+=(TIER_SCORE[t.tier_type]||0);
      if(firstTierId[t.player_id]===undefined||t.id<firstTierId[t.player_id]) firstTierId[t.player_id]=t.id;
    });
    if(scoreMap[p.id]===undefined) return [null,0];
    const ranked=players.filter(x=>scoreMap[x.id]!==undefined)
      .sort((a,b)=>{
        const diff=scoreMap[b.id]-scoreMap[a.id];
        if(diff!==0) return diff;
        return (firstTierId[a.id]??0)-(firstTierId[b.id]??0);
      });
    return [ranked.findIndex(x=>x.id===p.id)+1, scoreMap[p.id]];
  }
  const modeTiers=tiers.filter(t=>t.mode_id===activeMode);
  const tierMap={};
  modeTiers.forEach(t=>tierMap[t.player_id]=t);
  if(!tierMap[p.id]) return [null,0];
  const ranked=players.filter(x=>tierMap[x.id])
    .sort((a,b)=>{
      const diff=tierScore(tierMap[a.id]?.tier_type)-tierScore(tierMap[b.id]?.tier_type);
      if(diff!==0) return diff;
      return (tierMap[a.id]?.id??0)-(tierMap[b.id]?.id??0);
    });
  return [ranked.findIndex(x=>x.id===p.id)+1, tierMap[p.id].tier_type];
}

function showSearchToast(msg){
  let el=document.getElementById('searchToast');
  if(!el){
    el=document.createElement('div');
    el.id='searchToast';
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);color:var(--text1);padding:10px 18px;border-radius:10px;font-size:.82rem;z-index:200;box-shadow:0 12px 30px -10px #000000a0;opacity:0;transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.opacity='0';},2200);
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

load();

function openModal(pid, rank, pts, tempPlayer){
  const p = tempPlayer || players.find(x=>x.id===pid);
  if(!p) return;
  const isTemp = !!tempPlayer;
  const playerName=esc(p.name);
  const reg=esc(p.region||'TH');
  const badge=esc(p.badge);
  const bclass=badgeClass(p.badge);

  // Overall shows all modes. A single mode shows only the selected mode. (การ์ดชั่วคราวไม่มี tier เลย)
  const tiersByP={};
  if(!isTemp) tiers.filter(t=>t.player_id===pid).forEach(t=>tiersByP[t.mode_id]=t.tier_type);
  const modalModes=activeMode==='overall'?modes:modes.filter(m=>m.id===activeMode);
  const hasTiers=!isTemp && modalModes.some(m=>tiersByP[m.id]);
  const tiersHtml=modalModes.map(m=>{
    const tier=tiersByP[m.id];
    if(!tier) return'';
    const iconContent=m.icon_url?`<img src="${esc(m.icon_url)}" alt="${esc(m.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:esc(m.icon||'🎮');
    const pct=Math.max(4,TIER_SCORE[tier]||0);
    const hex=TIER_HEX[tier]||'#777';
    return`<div class="mc-tier">
      <div class="mode-icon">${iconContent}</div>
      <div class="mc-tier-main">
        <div class="mc-tier-name">${esc(m.name)}</div>
        <div class="mc-bar"><i style="width:${pct}%;background:${hex}"></i></div>
      </div>
      <span class="tier-mini ${TIER_CLASS[tier]||'t-F'}">${tier}</span>
    </div>`;
  }).join('');

  const overallModes=modes.filter(m=>m.include_in_overall);
  const overallModeIds=new Set(overallModes.map(m=>m.id));
  const totalPts=tiers.filter(t=>t.player_id===pid&&overallModeIds.has(t.mode_id)).reduce((s,t)=>s+(TIER_SCORE[t.tier_type]||0),0);
  const activeModeInfo=modes.find(m=>m.id===activeMode);
  const positionLabel=esc(activeMode==='overall'?'OVERALL':(activeModeInfo?.name||'MODE'));
  const currentTier=activeMode==='overall'?null:tiersByP[activeMode];
  const positionMeta=activeMode==='overall'
    ?`${totalPts} points`
    :(currentTier?`${currentTier} tier / ${totalPts} overall pts`:`${totalPts} overall pts`);

  const regionLabels={'TH':'Thailand','AS':'Asia','EU':'Europe','NA':'North America'};
  const isUnranked = rank===null || rank===undefined;
  const modalRankImg=getAvatarImg(isUnranked, activeMode==='overall', totalPts);

  // สีประจำการ์ดตามอันดับ: 1 ทอง / 2 เงิน / 3 ทองแดง / อื่นๆ ทองหลัก / Unranked เทา
  const rc=isUnranked?'#6b7188':(RANK_COLORS[rank]||'#f2b93e');
  document.getElementById('modalInner').style.setProperty('--rc',rc);

  const playerTierCount=isTemp?0:tiers.filter(t=>t.player_id===pid).length;
  const statRank=isUnranked?'—':`#${rank}`;
  const statMid=activeMode==='overall'
    ?`${totalPts}<small>pts</small>`
    :(currentTier?`<span class="tier-mini ${TIER_CLASS[currentTier]||'t-F'}" style="height:26px;min-width:44px;font-size:.9rem">${currentTier}</span>`:'—');
  const statMidLabel=activeMode==='overall'?'Points':'Tier';

  document.getElementById('modalInner').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="mc-hero">
      <div class="mc-av-wrap">
        <div class="modal-avatar${modalRankImg?' locked':''}${modalRankImg===LOW_POINTS_IMG?' lowpts':(POINTS_IMGS.includes(modalRankImg)?' ptsup':'')}">${modalRankImg?`<img src="${modalRankImg}" alt="${isUnranked?'Unranked':playerName}">`:(p.avatar?`<img src="${esc(p.avatar)}" alt="${playerName}">`:esc((p.name?.[0]||'?').toUpperCase()))}</div>
        ${isUnranked?'':`<div class="mc-rank-chip">#${rank}</div>`}
      </div>
      <div class="modal-name">${playerName}</div>
      <div class="mc-meta">
        <span class="mc-chip">🌏 ${esc(regionLabels[reg]||reg)}</span>
        ${p.badge?`<span class="modal-badge ${bclass}">◈ ${badge}</span>`:''}
        ${p.uid?`<button type="button" class="mc-chip mc-uid" onclick="copyUid(this,${jsArg(String(p.uid))})" title="คัดลอก UID">UID <b>${esc(p.uid)}</b><span class="mc-copy">📋</span></button>`:''}
      </div>
    </div>
    <div class="mc-stats">
      <div class="mc-stat hl"><div class="mc-stat-label">${isUnranked?'Rank':positionLabel}</div><div class="mc-stat-val">${statRank}</div></div>
      <div class="mc-stat"><div class="mc-stat-label">${statMidLabel}</div><div class="mc-stat-val">${statMid}</div></div>
      <div class="mc-stat"><div class="mc-stat-label">Modes</div><div class="mc-stat-val">${playerTierCount}<small>/${modes.length}</small></div></div>
    </div>
    ${isUnranked?`<div style="text-align:center;color:var(--text3);font-size:.76rem;margin-top:8px">🚫 Unranked — ยังไม่มีข้อมูลแรงค์</div>`:''}
    ${hasTiers||isTemp?`<div class="modal-section">
      <div class="modal-section-title">Tiers</div>
      <div class="mc-tiers">${hasTiers?tiersHtml:'<div class="mc-empty">ยังไม่มี Tier</div>'}</div>
    </div>`:''}
    ${isTemp?`<div class="modal-section" style="background:var(--accent-soft);border-radius:10px;padding:10px;border:1px solid var(--accent)33">
      <div style="font-size:0.75rem;color:var(--text2);text-align:center;margin-bottom:8px">เทสเทียร์ กดตรงนี้</div>
      <a href="${document.getElementById('discordLink')?.href||'#'}" target="_blank" style="font-size:0.8rem;color:var(--accent);font-weight:600;text-align:center;text-decoration:none;display:block">[ COMBOO 500 ]</a>
    </div>`:''}
  `;

  const bd=document.getElementById('modalBackdrop');
  bd.style.display='flex';
  requestAnimationFrame(()=>bd.classList.add('show'));
  document.body.style.overflow='hidden';
}

const RANK_COLORS={1:'#f5c842',2:'#c8d0de',3:'#e09060'};
const TIER_HEX={'S':'#e8b84b','A+':'#ff6b6b','A':'#ff9355','A-':'#ffbe44','B+':'#c3ff5a','B':'#5fffaa','B-':'#00e8bb','C+':'#55cbff','C':'#55a3ff','C-':'#9d97ff','D+':'#cc77ff','D':'#ff77cc','D-':'#ff7788','F':'#777777'};

function copyUid(btn,uid){
  const mark=btn.querySelector('.mc-copy');
  const done=()=>{ if(mark){ mark.textContent='✓ คัดลอกแล้ว'; setTimeout(()=>{mark.textContent='📋'},1500); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(uid).then(done).catch(()=>showSearchToast('คัดลอกไม่สำเร็จ'));
  } else {
    showSearchToast('เบราว์เซอร์นี้คัดลอกไม่ได้');
  }
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalBackdrop')&&!e.target.classList.contains('modal-close')) return;
  const bd=document.getElementById('modalBackdrop');
  bd.classList.remove('show');
  setTimeout(()=>{bd.style.display='none';document.body.style.overflow='';},200);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal({target:document.getElementById('modalBackdrop')});
});

// RIPPLE EFFECT
function spawnRipple(el, e){
  const rect=el.getBoundingClientRect();
  const x=(e.clientX??e.touches?.[0]?.clientX??rect.left+rect.width/2)-rect.left;
  const y=(e.clientY??e.touches?.[0]?.clientY??rect.top+rect.height/2)-rect.top;
  const size=Math.max(rect.width,rect.height)*1.2;
  const r=document.createElement('span');
  r.className='ripple-circle';
  r.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px`;
  el.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
}

function attachRipples(){
  document.querySelectorAll('.t-row,.tab-btn,.stat-card,.nav-link').forEach(el=>{
    if(el.dataset.ripple) return;
    el.dataset.ripple='1';
    el.classList.add('ripple-host');
    el.addEventListener('pointerdown',e=>spawnRipple(el,e));
  });
}

// attach after every render
const _origRender=render;
render=function(...a){
  _origRender(...a);
  // ให้แถวไหลเข้าทีละแถว (หน่วงสูงสุด 14 แถวแรก)
  document.querySelectorAll('#tableBody .t-row').forEach((r,i)=>r.style.setProperty('--i',Math.min(i,14)));
  requestAnimationFrame(attachRipples);
};
